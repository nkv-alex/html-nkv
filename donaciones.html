    <div class="div-donaciones">
        <form action="#" method="post" style="max-width: 400px; margin: 0 auto;">
            
            <h2>Proceso de Pago</h2>

            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" name="nombre" required>

            <label for="email">Correo electrónico</label>
            <input type="email" id="email" name="email" required>

            <label for="tarjeta">Número de tarjeta</label>
            <input type="text" id="tarjeta" name="tarjeta" maxlength="16" required>

            <label for="exp">Fecha de expiración</label>
            <input type="month" id="exp" name="exp" required>

            <label for="cvv">CVV</label>
            <input type="password" id="cvv" name="cvv" maxlength="3" required>

            <label for="monto">Monto</label>
            <input type="number" id="monto" name="monto" min="1" required>

            <button type="submit">Procesar Pago</button>
        </form>
